<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Заправка в рейсе</title>

  <style>
    :root {
      --brand: #ff6200;
      --ink: #000;
      --sub: #64748b;
      --bg: #f5f5f5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #e9ebef;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--ink);
    }

    .screen {
      width: 390px;
      height: 844px;
      margin: 24px auto;
      background: #fff;
      border-radius: 36px;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(17, 24, 39, 0.08);
    }

    .status {
      height: 47px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 0 28px 8px;
      font-size: 15px;
      font-weight: 600;
      flex: none;
    }

    .content {
      flex: 1;
      padding: 4px 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow: hidden;
    }

    .title {
      font-size: 28px;
      font-weight: 700;
      margin: 4px 0 0;
    }

    .muted {
      color: var(--sub);
      font-size: 12px;
    }

    .card {
      background: var(--bg);
      border-radius: 16px;
      padding: 16px;
    }

    .route {
      font-size: 20px;
      font-weight: 600;
      margin: 4px 0;
    }

    .limit {
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .progress {
      height: 6px;
      background: #e3e6eb;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 10px;
    }

    .progress-fill {
      display: block;
      height: 100%;
      width: 0;
      background: var(--brand);
    }

    .btn {
      display: block;
      width: 100%;
      text-align: center;
      background: var(--brand);
      color: #fff;
      font-weight: 600;
      font-size: 16px;
      border-radius: 999px;
      padding: 16px;
      border: 0;
    }

    .bottom {
      padding: 12px 24px 34px;
      flex: none;
    }
  </style>
</head>

<body>

  <main class="screen">

    <div class="status">
      <span>9:41</span>
      <span>▮▮▮ ▭</span>
    </div>

    <div class="content">

      <div class="title">
        Заправка в рейсе
      </div>

      <div class="card">

        <div class="muted">
          Текущий рейс · <span id="trip-date">—</span>
        </div>

        <div class="route" id="trip-route">
          Загрузка...
        </div>

        <div class="muted" id="trip-truck">
          Тягач —
        </div>

      </div>

      <div class="card">

        <div class="muted">
          Лимит на топливо
        </div>

        <div class="limit" id="limit-left">
          —
        </div>

        <div class="muted">
          из <span id="limit-total">—</span>
        </div>

        <div class="progress">
          <span
            class="progress-fill"
            id="limit-progress-fill">
          </span>
        </div>

      </div>

    </div>

    <div class="bottom">
      <button class="btn" type="button">
        Заправиться
      </button>
    </div>

  </main>

  <script src="./fake-api.js"></script>
  <script src="./app.js"></script>

</body>
</html>
